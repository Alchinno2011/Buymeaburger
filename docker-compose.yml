services:
  shoppinglist_backend:
    image: ${DOCKER_REGISTRY-}shoppinglistbackend
    container_name: Api
    build:
      context: .
      dockerfile: shoppingList_backend/Dockerfile

    env_file:
       - .env

    environment:
      - ASPNETCORE_URLS=http://+:${API_IN_HTTP};https://+:${API_IN_HTTPS}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=${HTTPS_CERT_PATH}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${HTTPS_CERT_PASS}
      - ASPNETCORE_ENVIRONMENT=Development

    ports:
        - ${API_OUT_HTTPS}:${API_IN_HTTPS}
        - ${API_OUT_HTTP}:${API_IN_HTTP}

    networks:
      - Database
    depends_on:
      GroceryListDB:
        condition: service_healthy
    volumes:
      - ./https:/https



  GroceryListDB:
    image: postgres:14-alpine
    platform: linux/amd64
    container_name: GroceryListDB
    env_file:
        - .env
    environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_DATABASE}
    volumes:
        - ./.containers/PetersPizza/Database:/var/lib/postgresql/data
    expose:
        - ${DATABASE_IN}
    ports:
      - ${DATABASE_OUT}:${DATABASE_IN}
    networks:
        - Database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE} || exit 1"]
      interval: 10s       # wait 10s between checks
      timeout: 5s         # fail check if pg_isready hangs >5s
      retries: 10         # try 10 times before marking unhealthy
      start_period: 20s   # give 20s before the first check (important!)

networks:
  Database:
